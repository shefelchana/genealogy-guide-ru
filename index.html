var NAME_RU = 'Поиск предков', NAME_EN = 'Tracing Your Ancestors';
function isEnPath(p){ return p === '/en' || p.indexOf('/en/') === 0; }
function routeToFile(p){
  var f = p.replace(/^\//, '');
  if (f === '' || /\/$/.test(f)) f += 'README';
  return f + '.md';
}
function fileToRoute(f){ return '#/' + f.replace(/README\.md$/, '').replace(/\.md$/, ''); }
function langPlugin(hook, vm){
  hook.doneEach(function(){
    var p = decodeURIComponent(vm.route.path || '/');
    var en = isEnPath(p);
    document.documentElement.lang = en ? 'en' : 'ru';
    var h1 = document.querySelector('.markdown-section h1');
    var nm = en ? NAME_EN : NAME_RU, ht = h1 ? h1.textContent.trim() : '';
    document.title = !ht ? nm : (ht.indexOf(nm) === 0 ? ht : ht + ' — ' + nm);
    var link = document.querySelector('.app-name-link');
    if (link){ link.textContent = en ? NAME_EN : NAME_RU; link.setAttribute('href', en ? '#/en/' : '#/'); }
    var file = routeToFile(p);
    var other = en ? (EN2RU[file] || 'README.md') : (RU2EN[file] || 'en/README.md');
    var sw = document.querySelector('.lang-switch');
    if (!sw){ sw = document.createElement('div'); sw.className = 'lang-switch'; document.body.appendChild(sw); }
    sw.innerHTML = en ? '<b>English</b><span>·</span><a href="' + fileToRoute(other) + '">Русский</a>'
                      : '<a href="' + fileToRoute(other) + '">English</a><span>·</span><b>Русский</b>';
    var lang = (navigator.language || '').toLowerCase();
    if (!en && (p === '/' || p === '') && lang && !/^(ru|uk|be|kk)/.test(lang)){
      var sec = document.querySelector('.markdown-section');
      if (sec && !sec.querySelector('.en-banner')){
        var b = document.createElement('div'); b.className = 'en-banner';
        b.innerHTML = 'This guide is also available in English → <a href="#/en/">Tracing Your Ancestors: A Practical Guide</a>';
        sec.insertBefore(b, sec.firstChild);
      }
    }
  });
}
